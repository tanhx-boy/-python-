<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>文件完整性校验</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9 15h6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9 3L7 21M17 3l-2 18"/><path d="M4 9h17M3 15h17"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8z"/></symbol>
    <symbol id="i-glass" viewBox="0 0 24 24"><path d="M12 3c3.5 4.2 6 7.3 6 10.4A6 6 0 0 1 6 13.4C6 10.3 8.5 7.2 12 3z"/><path d="M9.5 13.5a2.5 2.5 0 0 0 2.5 2.5"/></symbol>
  </svg>

  <div class="aurora" aria-hidden="true">
    <span class="aurora__blob aurora__blob--1"></span>
    <span class="aurora__blob aurora__blob--2"></span>
    <span class="aurora__blob aurora__blob--3"></span>
    <span class="aurora__blob aurora__blob--4"></span>
    <span class="aurora__beam"></span>
    <span class="aurora__grain"></span>
  </div>

  <div class="shell">
    <header class="topbar glass">
      <div class="brand">
        <span class="brand__orb" aria-hidden="true"></span>
        <div class="brand__copy">
          <h1 class="brand__name" data-i18n="appName">文件完整性校验</h1>
          <p class="brand__tagline" data-i18n="tagline">PRISMATIC · 本地哈希工作台</p>
        </div>
      </div>
      <div class="topbar__actions">
        <span class="meta-pill"><strong id="metaCount">0</strong><span data-i18n="filesUnit">个文件</span></span>
        <button type="button" class="icon-btn" id="themeBtn" title="切换主题">
          <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
        <button type="button" class="lang-btn" id="langBtn" title="切换语言">EN</button>
        <button type="button" class="icon-btn" id="aboutBtn" title="关于">
          <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="pane pane--files">
        <div class="dropzone glass-strong" id="dropzone" role="button" tabindex="0">
          <div class="dropzone__body">
            <span class="dropzone__glyph">
              <svg class="icon icon--lg" aria-hidden="true"><use href="#i-file-plus"/></svg>
            </span>
            <div class="dropzone__copy">
              <p class="dropzone__title" data-i18n="dropTitle">拖拽文件到此处</p>
              <p class="dropzone__hint" data-i18n="dropHint">支持多选 · 全部计算在本地完成</p>
            </div>
            <button type="button" class="ghost-btn" id="browseBtn">
              <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
              <span data-i18n="browse">浏览文件</span>
            </button>
          </div>
          <div class="dropzone__veil" aria-hidden="true"><span data-i18n="dropRelease">松开以添加文件</span></div>
          <input id="fileInput" type="file" multiple hidden>
        </div>

        <section class="card glass card--files">
          <header class="card__head">
            <h2 class="card__title">
              <span class="card__tick" aria-hidden="true"></span>
              <span data-i18n="filesTitle">文件</span>
              <span class="badge" id="fileBadge">0</span>
            </h2>
            <button class="text-btn" id="clearBtn" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>
              <span data-i18n="clearAll">全部清空</span>
            </button>
          </header>
          <div class="filelist scroll" id="fileList" role="list"></div>
          <div class="empty" id="filesEmpty">
            <span class="empty__glyph">
              <svg class="icon icon--lg" aria-hidden="true"><use href="#i-file"/></svg>
            </span>
            <p class="empty__title" data-i18n="filesEmpty">尚未添加文件</p>
            <p class="empty__hint" data-i18n="filesEmptyHint">拖拽或浏览文件，即刻开始校验</p>
          </div>
        </section>
      </section>

      <section class="pane pane--work">
        <section class="card glass card--algos">
          <header class="card__head">
            <h2 class="card__title">
              <span class="card__tick" aria-hidden="true"></span>
              <span data-i18n="algosTitle">算法选择</span>
              <span class="badge" id="algoBadge">1/16</span>
            </h2>
            <div class="head-actions">
              <button class="text-btn" id="selectAllBtn" type="button" data-i18n="selectAll">全选</button>
              <span class="head-divider" aria-hidden="true"></span>
              <button class="text-btn" id="resetAlgosBtn" type="button" data-i18n="resetAlgos">重置</button>
            </div>
          </header>
          <div class="algogrid" id="algoGrid" role="group" aria-label="算法选择" data-i18n-aria="algosTitle"></div>
        </section>

        <section class="card glass card--results">
          <header class="card__head">
            <h2 class="card__title">
              <span class="card__tick" aria-hidden="true"></span>
              <span data-i18n="resultsTitle">校验结果</span>
              <span class="badge" id="resultBadge">0</span>
            </h2>
            <div class="head-actions">
              <button class="text-btn" id="copyAllBtn" type="button">
                <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>
                <span data-i18n="copyAll">复制全部</span>
              </button>
              <button class="accent-btn" id="exportBtn" type="button">
                <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
                <span data-i18n="export">导出</span>
              </button>
            </div>
          </header>
          <div class="results scroll" id="results" hidden></div>
          <div class="empty" id="resultsEmpty">
            <span class="empty__glyph empty__glyph--prism">
              <svg class="icon icon--lg" aria-hidden="true"><use href="#i-hash"/></svg>
            </span>
            <p class="empty__title" data-i18n="resultsEmpty">等待计算</p>
            <p class="empty__hint" data-i18n="resultsEmptyHint">校验结果将在此处逐条呈现</p>
          </div>
        </section>
      </section>
    </main>

    <footer class="statusbar glass-strong">
      <div class="status">
        <span class="status__dot" id="statusDot" aria-hidden="true"></span>
        <span class="status__text" id="statusText">就绪</span>
        <span class="status__sep" aria-hidden="true"></span>
        <span class="progress" aria-hidden="true"><span class="progress__fill" id="progressFill"></span></span>
        <span class="status__count" id="statusCount">0 / 0</span>
      </div>
      <div class="statusbar__right">
        <label class="glass-control">
          <svg class="icon" aria-hidden="true"><use href="#i-glass"/></svg>
          <input id="glassRange" type="range" min="0.12" max="0.5" step="0.01" value="0.25" aria-label="玻璃质感">
        </label>
        <button class="primary-btn" id="calcBtn" type="button">
          <span class="primary-btn__spinner" aria-hidden="true"></span>
          <svg class="icon primary-btn__icon" aria-hidden="true"><use href="#i-sparkle"/></svg>
          <span class="primary-btn__label" data-i18n="calculate">开始计算</span>
          <kbd class="kbd">Ctrl ↵</kbd>
        </button>
      </div>
    </footer>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <div class="modal" id="aboutModal" hidden>
    <div class="modal__scrim" data-close-modal></div>
    <div class="modal__card glass-strong" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
      <button class="icon-btn modal__close" id="aboutClose" type="button" title="关闭">
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
      <span class="brand__orb brand__orb--lg" aria-hidden="true"></span>
      <h2 class="modal__title" id="aboutTitle" data-i18n="aboutTitle">关于 文件完整性校验</h2>
      <p class="modal__body" data-i18n="aboutBody">一个轻盈、通透的本地文件完整性校验工具。所有哈希计算均在当前设备完成，文件不会离开本机。</p>
      <div class="modal__chips">
        <span>Go · single binary</span>
        <span data-i18n="chipLocal">本地计算</span>
        <span>SHA-2 · SHA-3 · SM3</span>
      </div>
      <div class="modal__foot">
        <span>FileChecker</span>
        <span class="modal__version">v2.0.0</span>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
